generated: '2026-07-19'
method: searched
source: https://www.kurrent.io/releases
versioning:
  scheme: calendar-major-minor
  current: '26.1'
  detail: >-
    KurrentDB releases are numbered by year and release within that year (25.0, 25.1, 26.0, 26.1).
    Selected releases are designated Long Term Support. The HTTP and gRPC APIs are not
    URI-versioned; they are versioned with the server release, and documentation is published per
    server version under /server/vNN.N/. Client SDKs carry their own independent version lines.
  docs: https://docs.kurrent.io/server/v26.1/
  releases: https://www.kurrent.io/releases
support_policy:
  lts: true
  detail: >-
    Kurrent designates Long Term Support releases (for example EventStoreDB 23.10 LTS and 24.10)
    alongside interim feature releases.
deprecation:
  policy_url: https://docs.kurrent.io/clients/tcp/
  sunset_header: false
  detail: >-
    Kurrent does not publish RFC 8594 Sunset or Deprecation response headers — as a database rather
    than a hosted multi-tenant API, deprecation is communicated through release notes,
    documentation status and migration guides. The two live deprecations are the legacy TCP client
    protocol, which is superseded by gRPC and documented under a "Legacy TCP Clients (deprecated)"
    section, and the EventStoreDB-branded client packages, superseded by the KurrentDB-branded
    packages after the 25.0 rebrand. Kurrent publishes an official migration Agent Skill
    (kurrent-upgrade) and a migration-specialist agent for both paths.
  deprecated_surfaces:
  - name: Legacy TCP client protocol
    superseded_by: gRPC client SDKs
    docs: https://docs.kurrent.io/clients/tcp/
  - name: EventStore-branded client packages
    superseded_by: KurrentDB-branded client packages
    detail: >-
      @eventstore/db-client, EventStore.Client.Grpc.Streams and esdbclient are superseded by
      @kurrent/kurrentdb-client, KurrentDB.Client and kurrentdbclient respectively.
    migration: https://github.com/kurrent-io/skills
  - name: esdb:// connection-string scheme
    superseded_by: kurrentdb:// connection-string scheme
deprecated_operations: []
status_page: https://status.eventstore.cloud/
sla:
  detail: >-
    Availability commitments are set per Kurrent Cloud plan and commercial agreement; Kurrent does
    not publish a single public uptime target page.
  url: https://www.kurrent.io/pricing
security_advisories:
  detail: >-
    Kurrent publishes security releases through the same releases feed. The February 2024 security
    release addressed CVE-2024-26133 across the 23.10, 22.10, 21.10 and 20.10 lines.
  url: https://www.kurrent.io/releases
