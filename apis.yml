- aid: kurrent:kurrentdb-grpc-api
  name: KurrentDB gRPC API
  description: >-
    The primary protocol for KurrentDB. The published protocol buffer definitions cover the v2 streams
    service (multi-stream appends, reads), the schema registry service, the secondary index service, and
    the shared RPC error model. Every official client SDK — .NET, Java, Node.js, Python, Go and Rust —
    is generated against these contracts.
