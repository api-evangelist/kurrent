aid: kurrent
name: Kurrent
description: >-
  Kurrent — formerly Event Store Ltd — builds KurrentDB, an event-native database purpose-built to
  store, process and deliver application state changes as an immutable, append-only log of events.
  Where a traditional CRUD database overwrites rows and discards the history that produced them,
  KurrentDB retains every state change as a first-class event, giving applications a complete audit
  trail, temporal queries and the ability to replay history to rebuild state or seed new read
  models. The product line spans KurrentDB (open-source and commercial, self-hosted), Kurrent Cloud
  (managed clusters on AWS, Azure and Google Cloud), Kurrent Enterprise, and Capacitor, a shared
  memory layer for agentic coding. Developers integrate over a primary gRPC protocol with official
  client SDKs for .NET, Java, Node.js, Python, Go and Rust, or over the native AtomPub-style HTTP
  API. Connectors move events in and out of Kafka, MongoDB, Elasticsearch, RabbitMQ, Pulsar, SQL and
  HTTP endpoints. KurrentDB is widely used for event sourcing, CQRS, event-driven microservices,
  change data capture and, increasingly, as durable memory for AI agents.
