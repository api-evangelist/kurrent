notes: >-
  Kurrent is one of the few providers in the network that publishes Agent Skills itself. The
  kurrent-io/skills repository ships a plugin with Claude Code, Codex and Cursor manifests, six
  skills and three sub-agents (code-reviewer, migration-specialist, troubleshooter); a separate
  kurrent-io/coding-agent-skills repository ships a code-generation skill with runnable templates
  for seven languages. Those seven are captured VERBATIM below and marked method: searched. The two
  API Evangelist skills at the end were generated to cover the HTTP API surface, which the
  provider's own skills route around in favour of the gRPC SDKs; every operation they name was
  verified against openapi/kurrent-kurrentdb-http-api-openapi.yml.
provider_plugin:
  repository: https://github.com/kurrent-io/skills
  install: Add the kurrent-io/skills marketplace, then install the "kurrent" plugin.
  manifests:
  - .claude-plugin/marketplace.json
  - .cursor-plugin/marketplace.json
  - .agents/plugins/marketplace.json
  agents:
  - name: code-reviewer
    description: Reviews code that uses KurrentDB.
  - name: migration-specialist
    description: Drives EventStoreDB to KurrentDB and TCP to gRPC migrations.
  - name: troubleshooter
    description: Diagnoses KurrentDB problems.
